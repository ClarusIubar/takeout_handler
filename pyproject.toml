[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takeout-handler"
version = "0.1.0"
description = "ChatGPT/Gemini Takeout raw export to Obsidian markdown pipeline"
requires-python = ">=3.10"

# 런타임 파이프라인(run.py/common/vendors)은 표준 라이브러리만 사용하므로
# [project.dependencies]는 비워둔다. mcp는 mcp_server/ 기능에만 필요한 opt-in 의존성.
[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]

[tool.setuptools]
packages = ["common", "vendors", "mcp_server"]

[tool.pytest.ini_options]
# data/, result/에는 실제 takeout에서 나온 사용자 파일(우연히 test_*.py로 시작하는 첨부파일
# 등)이 들어있을 수 있으므로, pytest가 저장소 전체를 훑지 않고 tests/만 보게 제한한다.
testpaths = ["tests"]
markers = [
    "smoke: 임포트/CLI가 죽지 않는지만 확인하는 가장 얕고 빠른 테스트",
    "integration: argparse->벤더 detect/convert->upsert/publish 전체 배선을 검증하는 테스트",
    "regression: 과거 이슈에서 실제로 터졌던 버그를 그 경로 그대로 재현해 고정하는 테스트",
]
