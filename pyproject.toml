[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takeout-handler"
version = "0.1.0"
description = "ChatGPT/Gemini Takeout raw export to Obsidian markdown pipeline"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["common", "vendors"]

[tool.pytest.ini_options]
# data/, result/에는 실제 takeout에서 나온 사용자 파일(우연히 test_*.py로 시작하는 첨부파일
# 등)이 들어있을 수 있으므로, pytest가 저장소 전체를 훑지 않고 tests/만 보게 제한한다.
testpaths = ["tests"]
